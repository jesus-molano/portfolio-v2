<!doctype html>
<html lang="{{lang}}"><head><meta charset="utf-8">
<style>
@font-face { font-family: "Unbounded"; src: url({{fonts}}/unbounded-latin.woff2) format("woff2"); font-weight: 200 900; }
@font-face { font-family: "JetBrains Mono"; src: url({{fonts}}/jetbrains-latin.woff2) format("woff2"); font-weight: 100 800; }
@font-face { font-family: "BigShoulders"; src: url({{root}}/src/app/fonts/BigShouldersDisplay-Black.latin.woff2) format("woff2"); font-weight: 900; }
:root { {{tokens}} }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--cream); }
.card { position: relative; width: 1200px; height: 630px; background: var(--cream); }
.p { position: absolute; overflow: hidden; border-radius: 3px; background: var(--night); }
.p::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 2px rgba(43, 24, 72, 0.85); border-radius: 3px; pointer-events: none; }
.p img.shot { position: absolute; width: 100%; height: 100%; object-fit: cover; }
/* The drive into the city, his name on the boards over the causeway. */
.big { left: 10px; top: 10px; width: 640px; height: 404px; }
.big img { object-position: 46% 58%; }
/* The title block, on the start menu's slab colours. */
.title { left: 10px; top: 424px; width: 640px; height: 196px; background: linear-gradient(100deg, var(--magenta) 0%, #ff5a7a 45%, var(--orange) 78%, var(--sodium) 118%); }
.name { position: absolute; left: 30px; top: 30px; white-space: nowrap; font: 900 64px/1 "Unbounded", sans-serif; letter-spacing: -0.01em; color: var(--cream); text-shadow: 3px 3px 0 var(--ink), 6px 6px 0 rgba(43, 24, 72, 0.55); }
.role { position: absolute; left: 33px; top: 98px; font: 900 40px/1 "BigShoulders", sans-serif; letter-spacing: 0.06em; color: var(--ink); }
.drive { position: absolute; left: 32px; bottom: 22px; display: flex; align-items: center; gap: 12px; font: 700 15px/1 "JetBrains Mono", monospace; letter-spacing: 0.14em; color: var(--ink); text-transform: uppercase; }
.key { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 7px; background: var(--cream); color: var(--ink); font: 700 18px/1 "JetBrains Mono", monospace; letter-spacing: 0; box-shadow: 0 4px 0 var(--ink), 0 0 0 2px var(--ink) inset; transform: translateY(-2px); }
.url { position: absolute; right: 26px; bottom: 26px; font: 700 15px/1 "JetBrains Mono", monospace; letter-spacing: 0.08em; color: var(--cream); text-shadow: 1px 1px 0 var(--ink); }
/* Him at the wheel. */
.driver { left: 660px; top: 10px; width: 260px; height: 300px; }
.driver img { object-position: 72% 40%; transform: scale(1.65); transform-origin: 72% 30%; }
/* Dante, the culprit, mid-strike, his claw across the panel. */
.dante { left: 930px; top: 10px; width: 260px; height: 300px; background: linear-gradient(180deg, #2a1650 0%, #4a2a86 70%, #6a3a9a 100%); }
.dante .chart { position: absolute; inset: 0; background: repeating-linear-gradient(180deg, transparent 0 37px, rgba(255, 244, 241, 0.16) 37px 38px); }
.dante img { position: absolute; left: 50%; bottom: 6px; height: 88%; transform: translateX(-50%); filter: drop-shadow(0 6px 10px rgba(10, 0, 20, 0.5)); }
.dante svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.dante .chip { position: absolute; left: 12px; top: 12px; font: 700 12px/1 "JetBrains Mono", monospace; letter-spacing: 0.12em; padding: 6px 8px; color: var(--cream); background: rgba(26, 13, 56, 0.82); border: 1px solid var(--magenta); border-radius: 4px; }
.dante .chip b { color: var(--magenta); }
/* The Afterglow at night, its marquee lettered as the page letters it. */
.cinema { left: 660px; top: 320px; width: 260px; height: 300px; }
.cinema img { object-position: 50% 100%; transform: scale(1.04); transform-origin: 50% 92%; }
/* The army's roadside board, whole. */
.army { left: 930px; top: 320px; width: 260px; height: 300px; }
.army img { object-position: 44% 50%; }
</style></head>
<body><div class="card">
  <div class="p big"><img class="shot" src="frames/hero-chase.webp" alt=""></div>
  <div class="p title">
    <div class="name">{{name}}</div>
    <div class="role">{{role}}</div>
    <div class="drive"><span class="key">W</span><span>{{drive}}</span></div>
    <div class="url">{{host}}</div>
  </div>
  <div class="p driver"><img class="shot" src="frames/hero-driver.webp" alt=""></div>
  <div class="p dante"><div class="chart"></div><img src="{{root}}/public/interlude/dante-swipe.webp" alt="">{{claw}}<div class="chip"><b>{{hostile}}</b> · Nº 03</div></div>
  <div class="p cinema"><img class="shot" src="frames/cinema-{{lang}}.webp" alt=""></div>
  <div class="p army"><img class="shot" src="frames/army.webp" alt=""></div>
</div></body></html>

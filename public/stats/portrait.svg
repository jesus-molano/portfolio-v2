<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480">
  <!-- Jesús as a player card, with Dante on his shoulder as player 2. Drawn for Vice Afterglow; no photo. -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#b9a4e0" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#8a4dff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#8a4dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="42%" cy="36%" r="66%">
      <stop offset="0" stop-color="#f6f0fd"/>
      <stop offset=".7" stop-color="#d8cbf1"/>
      <stop offset="1" stop-color="#b29de0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" x2="1">
      <stop offset="0" stop-color="#3d2253"/>
      <stop offset=".55" stop-color="#52305f"/>
      <stop offset="1" stop-color="#6e3d69"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140926"/>
      <stop offset=".45" stop-color="#1c0f30"/>
      <stop offset="1" stop-color="#1c0f30" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#ff2d95"/>
      <stop offset=".55" stop-color="#ff8a5c"/>
      <stop offset="1" stop-color="#ffd8a8"/>
    </linearGradient>
    <linearGradient id="tee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1849"/>
      <stop offset="1" stop-color="#170b30"/>
    </linearGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0d2c"/>
      <stop offset=".55" stop-color="#3d2253"/>
      <stop offset="1" stop-color="#4a2a5c"/>
    </linearGradient>
    <radialGradient id="fur" cx="58%" cy="34%" r="72%">
      <stop offset="0" stop-color="#fff7ee"/>
      <stop offset=".7" stop-color="#eadbd9"/>
      <stop offset="1" stop-color="#bfa6b8"/>
    </radialGradient>
    <radialGradient id="mask" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#8a6a76"/>
      <stop offset="1" stop-color="#5f4558"/>
    </radialGradient>
    <filter id="rim" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.4"/></filter>
    <clipPath id="torso"><path d="M0 480C2 418 24 382 80 366C112 357 136 348 146 332L214 332C224 348 248 357 280 366C336 382 358 418 360 480Z"/></clipPath>
    <clipPath id="head"><path id="headShape" d="M108 176C104 132 116 98 142 84C162 73 198 73 218 84C244 98 256 132 252 176C258 178 264 186 263 197C262 210 255 220 248 222C244 252 230 280 210 296C200 304 190 308 180 308C170 308 160 304 150 296C130 280 116 252 112 222C105 220 98 210 97 197C96 186 102 178 108 176Z"/></clipPath>
  </defs>

  <!-- The moon behind him. -->
  <circle cx="180" cy="190" r="200" fill="url(#halo)"/>
  <circle cx="180" cy="186" r="128" fill="url(#moon)"/>
  <g fill="#9d86d6" opacity=".3"><circle cx="128" cy="146" r="15"/><circle cx="236" cy="238" r="20"/><circle cx="230" cy="116" r="8"/><circle cx="114" cy="236" r="9"/></g>

  <!-- Torso in the striped tee. -->
  <path d="M0 480C2 418 24 382 80 366C112 357 136 348 146 332L214 332C224 348 248 357 280 366C336 382 358 418 360 480Z" fill="url(#tee)"/>
  <g clip-path="url(#torso)" fill="#efe2f4" opacity=".5">
    <rect y="374" width="360" height="7"/><rect y="390" width="360" height="7"/><rect y="406" width="360" height="7"/><rect y="422" width="360" height="7"/>
    <rect y="438" width="360" height="7"/><rect y="454" width="360" height="7"/><rect y="470" width="360" height="7"/>
  </g>
  <g clip-path="url(#torso)" fill="none">
    <path d="M0 480C2 418 24 382 80 366C112 357 136 348 146 332L214 332C224 348 248 357 280 366C336 382 358 418 360 480" stroke="#d6c8f0" stroke-width="10" opacity=".55" filter="url(#rim)"/>
    <path d="M280 366C336 382 358 418 360 480" stroke="#ff2d95" stroke-width="8" opacity=".55" filter="url(#rim)"/>
  </g>

  <!-- Neck and collar. -->
  <path d="M144 268H216L218 334C208 354 152 354 142 334Z" fill="url(#neck)"/>
  <path d="M140 332C152 356 208 356 220 332" fill="none" stroke="#120826" stroke-width="7" stroke-linecap="round"/>

  <!-- Head: skin, the skin fade, the crew cut on top. -->
  <use href="#headShape" fill="url(#skin)"/>
  <g clip-path="url(#head)">
    <path d="M100 70H260V176C252 150 244 136 230 128C210 118 150 118 130 128C116 136 108 150 100 176Z" fill="url(#fade)"/>
    <path d="M110 140C112 108 130 88 156 82C172 78 190 78 206 82C232 88 248 108 250 140C246 124 236 112 220 106C200 99 160 99 140 106C124 112 114 124 110 140Z" fill="#120722"/>
    <path d="M142 92C162 84 196 84 218 92M136 104C160 94 200 94 226 104" fill="none" stroke="#5a3f86" stroke-width="1.2" opacity=".7"/>
    <!-- Beard and moustache: full, with a fade at the sideburns. -->
    <path d="M112 200C114 216 116 232 122 248C130 270 144 288 160 300C168 306 174 310 180 310C186 310 192 306 200 300C216 288 230 270 238 248C244 232 246 216 248 200C244 214 238 226 230 234C222 242 212 246 202 246C196 246 188 240 180 240C172 240 164 246 158 246C148 246 138 242 130 234C122 226 116 214 112 200Z" fill="#170a28"/>
    <path d="M144 246C150 231 166 226 180 231C194 226 210 231 216 246C208 241 194 240 180 243C166 240 152 241 144 246Z" fill="#170a28"/>
    <path d="M160 256C170 259 190 259 200 256" fill="none" stroke="#5c3354" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M178 186C177 198 175 210 172 218C177 222 184 222 189 219" fill="none" stroke="#9a6a9a" stroke-width="1.6" stroke-opacity=".55" stroke-linecap="round"/>
    <!-- Rim light: lavender on the moon side, pink on the other. -->
    <use href="#headShape" fill="none" stroke="#e7dcfa" stroke-width="6" opacity=".45" filter="url(#rim)"/>
    <path d="M252 176C258 178 264 186 263 197C262 210 255 220 248 222C244 252 230 280 210 296" fill="none" stroke="#ff2d95" stroke-width="7" opacity=".7" filter="url(#rim)"/>
  </g>
  <use href="#headShape" fill="none" stroke="#f4eefc" stroke-width="1.2" stroke-opacity=".45"/>

  <!-- Gold aviators. -->
  <path d="M126 176L106 182M234 176L254 180" stroke="#ffd27a" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M126 176C126 168 172 166 172 174C174 192 166 206 150 206C134 206 123 192 126 176Z" fill="url(#lens)" stroke="#ffd27a" stroke-width="2.2"/>
  <path d="M234 176C234 168 188 166 188 174C186 192 194 206 210 206C226 206 237 192 234 176Z" fill="url(#lens)" stroke="#ffd27a" stroke-width="2.2"/>
  <path d="M172 173Q180 167 188 173M140 171Q180 162 220 171" fill="none" stroke="#ffd27a" stroke-width="2"/>
  <path d="M134 181l13-7M139 196l24-15M194 181l13-7M198 196l24-15" stroke="#fff4f1" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>

  <!-- The dark hoop: gunmetal, blue where the light grazes it. -->
  <circle cx="256" cy="226" r="6" fill="none" stroke="#1d1a2e" stroke-width="3.2"/>
  <path d="M251.5 222a6 6 0 0 1 9 0" fill="none" stroke="#7fa8ff" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="260.5" cy="221.6" r="1.1" fill="#fff"/>

  <!-- Dante, player 2: a cream lynx-point kitten with blue eyes, on his shoulder. -->
  <g transform="translate(40 262)">
    <!-- Tail, ringed like a lynx point, curling down over the tee. -->
    <path d="M58 96C82 100 96 116 92 136C90 148 78 152 70 144" fill="none" stroke="#b49aa8" stroke-width="10" stroke-linecap="round"/>
    <path d="M64 97C86 102 94 118 91 134" fill="none" stroke="#6a4f63" stroke-width="10" stroke-dasharray="4 7"/>
    <path d="M72 145C76 150 84 148 88 142" fill="none" stroke="#5f4558" stroke-width="10" stroke-linecap="round"/>
    <!-- Body: a sitting kitten, pear-shaped, chest to the light. -->
    <path d="M8 104C4 84 8 62 22 52C30 46 42 46 50 52C64 62 68 84 64 104Z" fill="url(#fur)"/>
    <path d="M18 106C19 98 24 94 30 94C36 94 40 98 41 106Z" fill="#e2d2d8"/>
    <path d="M36 106C37 98 42 94 48 94C54 94 58 98 59 106Z" fill="#e2d2d8"/>
    <path d="M30 96v8M48 96v8" stroke="#bfa6b8" stroke-width="1"/>
    <!-- Ears: big kitten ears, the points dark with a pink inside. -->
    <path d="M3 30L6 -4L30 13Z" fill="#6a4f63"/>
    <path d="M69 30L66 -4L42 13Z" fill="#6a4f63"/>
    <path d="M9 22L10 5L23 14Z" fill="#d79bb6" opacity=".75"/>
    <path d="M63 22L62 5L49 14Z" fill="#d79bb6" opacity=".75"/>
    <!-- Head, a little wider than tall, with the lynx mask. -->
    <ellipse cx="36" cy="34" rx="31" ry="27" fill="url(#fur)"/>
    <path d="M17 38C17 25 55 25 55 38C55 51 46 59 36 59C26 59 17 51 17 38Z" fill="url(#mask)" opacity=".9"/>
    <path d="M28 12l2 8M36 10v9M44 12l-2 8" stroke="#7d6070" stroke-width="2" stroke-linecap="round" opacity=".8"/>
    <path d="M20 32c3-2 6-2 8 0M44 32c2-2 5-2 8 0" stroke="#fff4f1" stroke-opacity=".6" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <!-- Blue eyes. -->
    <path d="M21 37c3-5 9-5 11 0c-3 3-8 3-11 0zM40 37c2-5 8-5 11 0c-3 3-8 3-11 0z" fill="#7fd8ff"/>
    <circle cx="26.5" cy="37" r="1.6" fill="#120826"/><circle cx="45.5" cy="37" r="1.6" fill="#120826"/>
    <circle cx="27.4" cy="36" r=".7" fill="#fff"/><circle cx="46.4" cy="36" r=".7" fill="#fff"/>
    <path d="M33 45l3 2.6 3-2.6z" fill="#e7a3bf"/>
    <path d="M36 47.6v2.4M36 50c-2 2-4 2-5 1M36 50c2 2 4 2 5 1" stroke="#3a2440" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M15 45l-16-2M15 49l-15 3M57 45l16-2M57 49l15 3" stroke="#fff4f1" stroke-opacity=".6" stroke-width=".9"/>
  </g>
</svg>
